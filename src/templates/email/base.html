<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="x-apple-disable-message-reformatting">
  <title>{{headerTitle}}</title>
  <!--[if mso]>
  <style type="text/css">
    body, table, td, p, a { font-family: Arial, sans-serif !important; }
  </style>
  <![endif]-->
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      margin: 0;
      padding: 0;
      background-color: #f4f6f9;
      -webkit-font-smoothing: antialiased;
    }
    .email-wrapper {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    /* Brand band: white so the transparent navy wordmark stays legible. */
    .email-brand {
      background-color: #ffffff;
      padding: 22px 30px 18px;
      text-align: center;
      border-radius: 8px 8px 0 0;
      border-bottom: 3px solid #003A8F;
    }
    .email-brand img {
      display: block;
      margin: 0 auto;
      border: 0;
      outline: none;
      text-decoration: none;
      height: auto;
    }
    /* Shown only when the logo image cannot be rendered. */
    .brand-fallback {
      font-size: 20px;
      font-weight: 700;
      color: #003A8F;
      letter-spacing: 0.5px;
      margin: 0;
    }
    .brand-fallback span { color: #D83A03; }
    .email-header {
      background-color: #003A8F;
      color: white;
      padding: 24px 30px;
      text-align: center;
    }
    .email-header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      color: #ffffff;
    }
    .email-body {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    .info-box {
      background-color: #f0f4ff;
      padding: 16px 20px;
      margin: 20px 0;
      border-left: 4px solid #003A8F;
      border-radius: 0 6px 6px 0;
    }
    .info-box h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #003A8F;
    }
    .info-box p {
      margin: 4px 0;
      font-size: 14px;
    }
    .alert-box {
      background-color: #fff4f0;
      padding: 16px 20px;
      margin: 20px 0;
      border-left: 4px solid #D83A03;
      border-radius: 0 6px 6px 0;
    }
    .alert-box h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #D83A03;
    }
    .success-box {
      background-color: #f0faf0;
      padding: 16px 20px;
      margin: 20px 0;
      border-left: 4px solid #2e7d32;
      border-radius: 0 6px 6px 0;
    }
    .success-box h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #2e7d32;
    }
    .btn {
      display: inline-block;
      background-color: #003A8F;
      color: #ffffff !important;
      padding: 12px 28px;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      margin: 16px 0;
    }
    .btn-alert {
      background-color: #D83A03;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-critical { background-color: #fee2e2; color: #dc2626; }
    .badge-high { background-color: #fff7ed; color: #ea580c; }
    .badge-medium { background-color: #fefce8; color: #ca8a04; }
    .badge-low { background-color: #f0fdf4; color: #16a34a; }
    .badge-new { background-color: #eff6ff; color: #2563eb; }
    .badge-assigned { background-color: #f5f3ff; color: #7c3aed; }
    .badge-in_progress { background-color: #fefce8; color: #ca8a04; }
    .badge-resolved { background-color: #f0fdf4; color: #16a34a; }
    .badge-closed { background-color: #f1f5f9; color: #64748b; }
    .badge-reopened { background-color: #fff7ed; color: #ea580c; }
    .email-footer {
      text-align: center;
      margin-top: 24px;
      color: #94a3b8;
      font-size: 12px;
    }
    .email-footer p {
      margin: 4px 0;
    }
    .email-footer .footer-brand {
      color: #003A8F;
      font-weight: 700;
      font-size: 13px;
    }
    .email-footer .footer-tagline {
      color: #D83A03;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.4px;
    }
    .divider {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 20px 0;
    }
    @media only screen and (max-width: 620px) {
      .email-wrapper { padding: 12px !important; }
      .email-body { padding: 22px 18px !important; }
      .email-brand { padding: 18px 18px 14px !important; }
      .email-header { padding: 20px 18px !important; }
      .email-header h1 { font-size: 19px !important; }
    }
  </style>
</head>
<body>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f6f9;">
    <tr>
      <td align="center">
        <div class="email-wrapper">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;">
            <!-- Brand band -->
            <tr>
              <td class="email-brand">
                <img src="cid:growpath-logo" alt="GROW PATH — Your Digital Partner" width="165" style="width:165px;max-width:100%;">
              </td>
            </tr>
            <!-- Title band -->
            <tr>
              <td class="email-header">
                <h1>{{headerTitle}}</h1>
              </td>
            </tr>
            <!-- Content -->
            <tr>
              <td class="email-body">
                {{content}}
              </td>
            </tr>
          </table>

          <div class="email-footer">
            <p class="footer-brand">GROW PATH</p>
            <p class="footer-tagline">YOUR DIGITAL PARTNER</p>
            <p style="margin-top:10px;">This is an automated message from the Ticketing System.</p>
            <p>Please do not reply to this email.</p>
          </div>
        </div>
      </td>
    </tr>
  </table>
</body>
</html>
