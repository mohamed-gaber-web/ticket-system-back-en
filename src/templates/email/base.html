<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      margin: 0;
      padding: 0;
      background-color: #f4f6f9;
    }
    .email-wrapper {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    .email-header {
      background-color: #003A8F;
      color: white;
      padding: 24px 30px;
      text-align: center;
      border-radius: 8px 8px 0 0;
    }
    .email-header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
    }
    .email-body {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    .info-box {
      background-color: #f0f4ff;
      padding: 16px 20px;
      margin: 20px 0;
      border-left: 4px solid #003A8F;
      border-radius: 0 6px 6px 0;
    }
    .info-box h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #003A8F;
    }
    .info-box p {
      margin: 4px 0;
      font-size: 14px;
    }
    .alert-box {
      background-color: #fff4f0;
      padding: 16px 20px;
      margin: 20px 0;
      border-left: 4px solid #D83A03;
      border-radius: 0 6px 6px 0;
    }
    .alert-box h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #D83A03;
    }
    .success-box {
      background-color: #f0faf0;
      padding: 16px 20px;
      margin: 20px 0;
      border-left: 4px solid #2e7d32;
      border-radius: 0 6px 6px 0;
    }
    .success-box h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #2e7d32;
    }
    .btn {
      display: inline-block;
      background-color: #003A8F;
      color: #ffffff !important;
      padding: 12px 28px;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      margin: 16px 0;
    }
    .btn-alert {
      background-color: #D83A03;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-critical { background-color: #fee2e2; color: #dc2626; }
    .badge-high { background-color: #fff7ed; color: #ea580c; }
    .badge-medium { background-color: #fefce8; color: #ca8a04; }
    .badge-low { background-color: #f0fdf4; color: #16a34a; }
    .badge-new { background-color: #eff6ff; color: #2563eb; }
    .badge-assigned { background-color: #f5f3ff; color: #7c3aed; }
    .badge-in_progress { background-color: #fefce8; color: #ca8a04; }
    .badge-resolved { background-color: #f0fdf4; color: #16a34a; }
    .badge-closed { background-color: #f1f5f9; color: #64748b; }
    .badge-reopened { background-color: #fff7ed; color: #ea580c; }
    .email-footer {
      text-align: center;
      margin-top: 24px;
      color: #94a3b8;
      font-size: 12px;
    }
    .email-footer p {
      margin: 4px 0;
    }
    .divider {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="email-wrapper">
    <div class="email-header">
      <h1>{{headerTitle}}</h1>
    </div>
    <div class="email-body">
      {{content}}
    </div>
    <div class="email-footer">
      <p>This is an automated message from the Ticketing System.</p>
      <p>Please do not reply to this email.</p>
    </div>
  </div>
</body>
</html>
